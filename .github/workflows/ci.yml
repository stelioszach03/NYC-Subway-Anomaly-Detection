name: CI

on:
  push:
  pull_request:

jobs:
  history-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated history/export dependencies
        run: python -m pip install -r requirements.history-export.txt pytest==9.0.2
      - name: Test bounded collection and atomic daily exports offline
        run: PYTHONPATH=. python -m pytest tests/test_history_unit.py tests/test_history_export_unit.py tests/test_history_quality_unit.py

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests only
        run: PYTHONPATH=. pytest -q -m "not integration"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check landing data states
        run: node --test tests/landing_feed.test.mjs

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -f docker/Dockerfile.api .

      - name: Build Worker image
        run: docker build -f docker/Dockerfile.worker .

      - name: Build UI image
        run: docker build -f docker/Dockerfile.ui .
